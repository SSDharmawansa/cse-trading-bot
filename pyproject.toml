[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cse-trading-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13", "asyncpg>=0.29", "fastapi>=0.115", "httpx>=0.27",
  "pydantic-settings>=2.5", "psycopg[binary]>=3.2", "redis>=5", "sqlalchemy[asyncio]>=2.0", "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20", "pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
